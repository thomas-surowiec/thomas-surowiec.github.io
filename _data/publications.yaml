# ---------------------------------------------------------------------------
# Publication list. Edit this file, then run:  python3 tools/build.py
#
# Fields (only title/authors/year/kind are required):
#   kind:    journal | conference | preprint | chapter | other
#   award:   optional prize line shown with the entry
#   year:    year of the issue (preprints: year posted)
#   authors: names as they should appear; "T. M. Surowiec" is bolded automatically
#   title:   may contain simple HTML, e.g. <i>H</i><sup>1</sup>
#   venue:   journal / book / status line
#   details: volume, pages, article number ...
#   topics:  any of  risk | numerics | variational | games | ai | interdisciplinary
#   links:   any of  doi | arxiv | pdf | code | url  (arxiv = bare ID, doi = bare DOI)
#   note:    short extra remark shown in grey
# Entries can be in any order; the build script sorts by year (newest first).
# ---------------------------------------------------------------------------

