<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.name }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
<meta name="author" content="{{ site.name }}">
<link rel="canonical" href="{{ site.url }}/{{ page_file if page_file != 'index.html' else '' }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:url" content="{{ site.url }}/{{ page_file if page_file != 'index.html' else '' }}">
<meta property="og:image" content="{{ site.url }}/assets/img/portrait-960.webp">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/stix-two-text-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/style.css?v={{ build_id }}">
{% block head %}{% endblock %}
</head>
<body>
<a class="skip" href="#content">Skip to content</a>

<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="index.html">Thomas M. Surowiec</a>
    <nav class="site-nav" aria-label="Main">
      <ul>
        {% for item in site.nav %}
        <li><a href="{{ item.href }}"{% if item.href == page_file %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>

<main id="content">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>© {{ year }} Thomas M. Surowiec · Simula Research Laboratory, Oslo</span>
    <span>Last updated {{ updated }}</span>
  </div>
</footer>
<script src="assets/js/site.js?v={{ build_id }}" defer></script>
</body>
</html>
